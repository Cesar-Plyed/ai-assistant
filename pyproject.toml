[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-desktop-assistant"
version = "1.0.0"
description = "A PySide6 desktop assistant with provider-agnostic LLM tool execution"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Cesar Eduardo Castañeda López"},
]
dependencies = [
  "PySide6>=6.6",
  "openai>=1.40",
  "google-genai>=1.0",
  "psutil>=5.9",
  "playwright>=1.40",
  "pyautogui>=0.9.54",
  "markdown>=3.5",
  "anthropic>=0.48",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "beautifulsoup4>=4.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
]
build = ["pyinstaller>=6.0"]
mcp = [
    "mcp>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-qt>=4.4",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "tomli>=2.0; python_version < '3.11'",
  "mcp>=2.0",
]

[project.scripts]
ai-desktop-assistant = "main:main"

[tool.setuptools]
py-modules = ["config", "main"]
packages = ["core", "core.mcp", "core.providers", "core.tools", "ui"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
